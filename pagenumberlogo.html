<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logo page number grid</title>
  <style>
    :root {
      --page: #eeeeee;
      --cell: white;   /* cell background, so white shapes stay visible */
    }
    body {
      margin: 0;
      padding: 16px;
      background-color: var(--page);
      font-family: 'Fira Code', monospace;
    }
    .grid {
      display: grid;
      /* 16 columns on wide screens (16 x 72px + 15 x 8px gaps), fewer on narrow ones */
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: 8px;
      max-width: 1272px;
      margin: 0 auto;
    }
    figure {
      margin: 0;
      background: var(--cell);
      padding: 4px;
    }
    figure svg {
      width: 100%;
      height: auto;
      display: block;
    }
    figcaption {
      font-size: 10px;
      text-align: center;
      margin-top: 2px;
      color: #222;
    }
    .num {
    font-family: 'Fira Code', monospace;
    font-size: 200px;       /* in viewBox units, so it scales with the logo */
    font-weight: 600;
    stroke: #000;
    paint-order: stroke;    /* draw the outline behind the fill */
    pointer-events: none;
  }
  </style>
</head>

  <script>
    const NS = 'http://www.w3.org/2000/svg';
    const BITS = 8;                    // shapes per logo
    const TOTAL = 2 ** BITS;           // 256 logos
    const STEP = 360 / BITS;           // 45 degrees between shapes
    const ONE = '#000000';
    const ZERO = '#ffffff';

    const grid = document.getElementById('grid');

    for (let n = 0; n < TOTAL; n++) {
      // leftmost character = most significant bit = shape 0 (the unrotated one)
      const bits = n.toString(2).padStart(BITS, '0');

      const fig = document.createElement('figure');
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('viewBox', '100 100 800 800');
      svg.setAttribute('role', 'img');
      svg.setAttribute('aria-label', `Binary ${bits}, decimal ${n}`);

      const addUse = j => {
        const use = document.createElementNS(NS, 'use');
        use.setAttribute('href', '#a');
        use.setAttribute('fill', bits[j] === '1' ? ONE : ZERO);
        if (j) use.setAttribute('transform', `rotate(${j * STEP} 500 500)`);
        svg.appendChild(use);
      };

      // Draw the white (0) shapes first and the black (1) shapes on top,
      // so a white shape never hides a black one where they overlap.
      for (let j = 0; j < BITS; j++) if (bits[j] === '0') addUse(j);
      for (let j = 0; j < BITS; j++) if (bits[j] === '1') addUse(j);

      const label = document.createElementNS(NS, 'text');
      label.setAttribute('x', 500);
      label.setAttribute('y', 500);
      label.setAttribute('text-anchor', 'middle');   // center horizontally
      label.setAttribute('dy', '.35em');             // nudge down to center vertically
      label.setAttribute('class', 'num');
      label.textContent = n;
      svg.appendChild(label);

      fig.append(svg);
      grid.appendChild(fig);
    }

      for (let j = 0; j < BITS; j++) if (bits[j] === '0') addUse(j);
      for (let j = 0; j < BITS; j++) if (bits[j] === '1') addUse(j);


      const cap = document.createElement('figcaption');
