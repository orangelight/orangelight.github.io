  <main class="grid" id="grid"></main>

  <script>
    const NS = 'http://www.w3.org/2000/svg';
    const COUNT =75;   // how many logos
    function getRandomIntInclusive(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }
    const randomColor = () =>
      `hsl(${Math.floor(Math.random() * 360)} ${Math.floor(getRandomIntInclusive(100, 100))}% ${Math.floor(getRandomIntInclusive(30, 50))}%)`;

    const grid = document.getElementById('grid');

    for (let i = 0; i < COUNT; i++) {
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('viewBox', '0 0 1000 1000');
      svg.setAttribute('role', 'img');
      svg.setAttribute('aria-label', 'Logo');
      const blades = getRandomIntInclusive(4, 15);
      const color = randomColor();
      for (let j = 0; j < blades; j++) {
        const use = document.createElementNS(NS, 'use');
        use.setAttribute('href', '#a');
        use.setAttribute('fill', color);
        use.setAttribute('transform', `rotate(${j * 360 / blades} 500 500)`);
        svg.appendChild(use);
      }
      grid.appendChild(svg);
    }
  </script>
